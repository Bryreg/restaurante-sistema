name: CI

# Este repositorio es PRIVADO, así que los minutos de Actions se cobran contra
# la cuota de la cuenta. Con `on: push` sin filtrar, cada push a cualquier rama
# disparaba la suite entera —el backend solo tarda unos diez minutos—, y el
# 14-09-2026 la cuota se agotó a mitad de una corrida: el trabajo de backend
# terminó en verde y el de frontend ya no consiguió máquina. Desde entonces
# ninguna corrida arrancó (fallan en dos segundos, sin runner y sin log), así
# que 2a y 2b se construyeron enteros sin que el CI los mirara nunca.
#
# Ahora corre donde la señal importa: en `main`, que es lo que se despliega, y
# en cada pull request. Un push a una rama de trabajo SIN pull request abierto
# no dispara nada — si querés el verde antes de fusionar, abrí el pull request.
on:
  push:
    branches: [main]
  pull_request:

# Si llegan dos pushes seguidos a la misma referencia, la corrida vieja queda
# obsoleta pero sigue quemando minutos hasta terminar. Acá se cancela: el único
# resultado que importa es el del último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (typecheck, migraciones, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: restaurante_sistema_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d restaurante_sistema_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/restaurante_sistema_ci
      JWT_SECRET: ci-secret-not-for-production
      ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Typecheck (mypy)
        run: python -m mypy app

      - name: Migrar esquema (alembic upgrade head contra Postgres)
        run: python -m alembic upgrade head

      - name: Tests (suite completa)
        run: python -m pytest -q

  frontend:
    name: frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    # Sin `needs: backend`, a propósito. Esperaba al backend para no gastar
    # minutos cuando el repositorio era privado y se cobraban; ahora que es
    # público son gratis, y esa dependencia sólo cuesta 46 minutos de espera
    # y ESCONDE la señal del frontend cada vez que el backend falla — que es
    # justo cuando más conviene saber si además hay algo roto del otro lado.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22, no 20: `jsdom` 30 trae `undici` 8, que llama a
          # `webidl.util.markAsUncloneable` — una API que Node 20 no tiene. En
          # Node 20 el worker de vitest ni siquiera arranca: 83 errores y 82
          # tests corridos de 408. El entorno de desarrollo siempre usó 22, y
          # el CI nunca lo contradijo porque este trabajo NUNCA llegó a
          # ejecutarse: desde el primer día moría por facturación antes de
          # empezar. Queda declarado también en `frontend/package.json`
          # (`engines`), para que el requisito no viva sólo acá.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Tests (vitest, suite completa)
        run: npm run test -- --run

      - name: Build de producción
        run: npm run build
