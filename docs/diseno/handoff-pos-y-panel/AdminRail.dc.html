<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap"><link rel="stylesheet" href="https://unpkg.com/lucide-static@0.469.0/font/lucide.css"></helmet>
<aside style="width:222px;height:100%;box-sizing:border-box;background:var(--muted);border-right:1px solid var(--border);padding:8px;display:flex;flex-direction:column;font-family:'Archivo',system-ui,sans-serif;color:var(--foreground);font-variant-numeric:tabular-nums">
  <div style="display:flex;align-items:center;gap:8px;padding:2px 6px 10px;margin-bottom:6px;border-bottom:1px solid var(--border)">
    <i class="icon-store" style="font-size:16px;color:var(--muted-foreground)"></i>
    <div style="min-width:0"><div style="font-size:14px;font-weight:700;line-height:1.2">Restaurante Sistema</div><div style="font-size:12px;color:var(--muted-foreground)">{{ sede }}</div></div>
  </div>
  <nav style="display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
      <a href="#" style="display:flex;align-items:center;gap:8px;min-height:32px;padding:6px 8px;border-radius:6px;font-size:14px;font-weight:{{ it.peso }};text-decoration:none;background:{{ it.fondo }};color:{{ it.color }}"><i class="{{ it.icono }}" style="font-size:16px"></i><span style="flex:1">{{ it.label }}</span><span style="font-size:12px;font-weight:400;opacity:.7">{{ it.n }}</span></a>
    </sc-for>
  </nav>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:222,&quot;height&quot;:700},&quot;activo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Hoy&quot;,&quot;Informes&quot;,&quot;Caja&quot;,&quot;Inventario&quot;,&quot;Carta&quot;,&quot;Plata&quot;,&quot;Equipo&quot;,&quot;Ajustes&quot;],&quot;default&quot;:&quot;Hoy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sede&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Chapinero&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const activo = this.props.activo ?? "Hoy";
    const S = [["Hoy","icon-calendar-days",8],["Informes","icon-chart-column",""],["Caja","icon-banknote",1],["Inventario","icon-package",5],["Carta","icon-book-open",""],["Plata","icon-receipt",""],["Equipo","icon-users",""],["Ajustes","icon-settings",""]];
    return {
      sede: this.props.sede ?? "Chapinero",
      items: S.map(([label, icono, n]) => { const on = label === activo; return { label, icono, n,
        fondo: on ? "var(--primary)" : "transparent", color: on ? "var(--primary-foreground)" : "var(--muted-foreground)", peso: on ? 600 : 500 }; }),
    };
  }
}
</script>
</body>
</html>
