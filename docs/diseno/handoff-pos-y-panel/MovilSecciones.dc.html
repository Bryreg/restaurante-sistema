    const barra = [["Hoy", "icon-calendar-days"], ["Informes", "icon-chart-column"], ["Caja", "icon-banknote"], ["Avisos", "icon-circle-alert"], ["Más", "icon-ellipsis"]].map(([t, i]) => { const on = t === sec.activo; return { t, i, color: on ? "var(--primary)" : "var(--muted-foreground)", raya: on ? "inset 0 2px 0 0 var(--primary)" : "none" }; });
    return { titulo: sec.titulo, metricas, sel: metricas[this.state.sel] || metricas[0], varA: !varB, varB, barra };
  }
}
